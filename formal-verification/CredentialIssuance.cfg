\* TLC model configuration for CredentialIssuance.tla.
\* Bounded constants: 1 issuer, 2 subjects, 2 credential types, and at most
\* 2 issued credential ids (CONSTRAINT ModelBound).
SPECIFICATION Spec

CONSTANTS
  Issuers         = {"Issuer1"}
  Subjects        = {"Subject1", "Subject2"}
  CredentialTypes = {1, 2}

CONSTRAINT
  ModelBound

INVARIANTS
  TypeInvariant
  NoDuplicateActiveCredentials
  IssuedBeforeRevoked
  CountConsistency

PROPERTIES
  EventualIssuance
