[package]
name = "quorum-proof-benches"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "quorum_proof_benches"
path = "src/lib.rs"

[[bin]]
name = "scaling_report"
path = "src/bin/scaling_report.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
soroban-sdk = { version = "21.7", features = ["testutils"] }
quorum_proof = { path = "../contracts/quorum_proof", features = ["testutils"] }
sbt_registry = { path = "../contracts/sbt_registry", features = ["testutils"] }
zk_verifier = { path = "../contracts/zk_verifier", features = ["testutils"] }
