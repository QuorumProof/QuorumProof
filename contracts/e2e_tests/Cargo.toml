[package]
name = "e2e_tests"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
soroban-rpc = { version = "21.0", features = ["json"] }
stellar-base-sdk = { version = "0.8" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"
anyhow = "1"

[dev-dependencies]
tokio-test = "0.4"
