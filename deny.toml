[advisories]
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db/raw/main/db.json.gz"]
vulnerability = "deny"
# unsound: promoted from "warn" to "deny" — unsound crates represent
# undefined-behaviour risk even without a published CVE. Any new unsound
# advisory must be explicitly allowed here with a tracking comment.
unsound = "deny"
unmaintained = "warn"
# yanked: promoted from "warn" to "deny" — a yanked crate version has been
# explicitly retracted by its publisher, usually for a correctness or security
# reason. Accepting a yanked version silently is equivalent to ignoring the
# publisher's own retraction notice. Any exception must be explicitly allowed.
yanked = "deny"
notice = "warn"
allow = [
    # h2 0.3.27: unbounded empty DATA frames (RUSTSEC-2026-0258)
    # Tracking issue: https://github.com/cryptonautt/QuorumProof/issues/1490
    # Added: 2026-09-24. Re-evaluate once hyperium/h2 >=0.4 is available as a
    # transitive dep. scripts/check_deps.sh warns if this entry is >90 days old.
    "RUSTSEC-2026-0258",
]

[licenses]
unlicensed = "deny"
copyleft = "warn"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 OR MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
]
deny = []
copyleft-exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
