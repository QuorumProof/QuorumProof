# k8s/network-policy/monitoring-policy.yaml — Issue #1655: Network Policy for Pod Security.
#
# NetworkPolicy for the monitoring namespace (Prometheus, Grafana, Loki, Promtail).
#
# Prometheus must scrape pods in the quorumproof namespace, so this policy
# grants targeted cross-namespace egress. Grafana must serve dashboards to
# operators, so ingress from the ingress controller is allowed.

---
# Prometheus: scrape quorumproof pods + reach the Alertmanager
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-policy
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: quorumproof
    app.kubernetes.io/managed-by: network-policy
    app.kubernetes.io/component: monitoring
spec:
  podSelector:
    matchLabels:
      app: prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Grafana queries Prometheus
    - from:
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 9090
          protocol: TCP
    # API server may push rules; ingress from quorumproof namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: quorumproof
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Scrape api-server pods in quorumproof namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: quorumproof
          podSelector:
            matchLabels:
              app: quorumproof-api-server
      ports:
        - port: 3001
          protocol: TCP
    # Alertmanager
    - to:
        - podSelector:
            matchLabels:
              app: alertmanager
      ports:
        - port: 9093
          protocol: TCP

---
# Grafana: serve dashboards
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-policy
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: quorumproof
    app.kubernetes.io/managed-by: network-policy
    app.kubernetes.io/component: monitoring
spec:
  podSelector:
    matchLabels:
      app: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow dashboard access from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - port: 3000
          protocol: TCP
    # Kubelet health probes
    - from:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 3000
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Prometheus data source
    - to:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - port: 9090
          protocol: TCP
    # Loki data source
    - to:
        - podSelector:
            matchLabels:
              app: loki
      ports:
        - port: 3100
          protocol: TCP
