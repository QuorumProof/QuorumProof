# api-server "blue" slot — Issue #1648: blue-green deployment.
#
# One of two identical Deployments (blue / green). Only the slot selected by
# the live Service (service.yaml, selector `slot: <active>`) receives
# production traffic; the other slot is idle or hosts the next release and is
# reachable through the preview Service (service-preview.yaml) for
# pre-switch validation.
#
# Do not edit image tags here by hand — scripts/blue_green_deploy.sh sets the
# image on the idle slot with `kubectl set image`. See
# docs/blue-green-deployment.md.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: quorumproof-api-server-blue
  namespace: quorumproof
  labels:
    app: quorumproof-api-server
    slot: blue
    app.kubernetes.io/name: quorumproof-api-server
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: quorumproof
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quorumproof-api-server
      slot: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: quorumproof-api-server
        slot: blue
        app.kubernetes.io/name: quorumproof-api-server
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: quorumproof
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics/events"
        prometheus.io/port: "3001"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-server
          image: quorumproof/api-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3001"
            - name: LOG_LEVEL
              value: info
            - name: LOG_FILE
              value: /var/log/quorumproof/api.log
            - name: DEPLOYMENT_SLOT
              value: blue
          envFrom:
            - secretRef:
                name: quorumproof-api-server-env
          # Allow in-flight requests to drain after the Service stops routing
          # here, before SIGTERM reaches the process.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: log-dir
              mountPath: /var/log/quorumproof
      volumes:
        - name: log-dir
          emptyDir: {}
