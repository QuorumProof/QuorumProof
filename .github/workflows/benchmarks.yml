# .github/workflows/benchmarks.yml — Parameterized benchmark scaling report.
#
# Runs benches/tests/benchmarks.rs's *_scaling tests across a range of n per
# operation, fits an empirical complexity class via
# benches/src/bin/scaling_report.rs (scripts/scaling_benchmark_report.sh
# orchestrates both), and uploads the resulting Markdown report as a build
# artifact on every run.
#
# On pushes to main only, the updated benches/history/*.jsonl files are
# committed back to the repository so gradual complexity drift is visible via
# `git log` (issue #1466).  PR runs do not attempt a commit — they only
# generate the report and upload it as an artifact.
#
# This is additive to the existing fixed-threshold gate — it does not
# replace scripts/benchmark_compare.sh, scripts/profile_contracts.sh, or the
# assert!s already in benches/tests/benchmarks.rs.

name: Benchmark Scaling Report

on:
  pull_request:
    paths:
      - "contracts/**"
      - "benches/**"
  push:
    branches:
      - main
    paths:
      - "contracts/**"
      - "benches/**"

jobs:
  scaling-report:
    name: Scaling benchmarks & complexity report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so `git log` comparisons work, and use a token
          # that allows pushing back to main on the commit-back step.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            benches/target
          key: ${{ runner.os }}-cargo-benches-${{ hashFiles('benches/Cargo.lock', 'Cargo.lock') }}

      # Issue #1466: Fail loudly if the history directory is unwritable in CI
      # rather than silently producing an empty / partial report.
      - name: Check benches/history is writable
        run: |
          if [ ! -d benches/history ]; then
            echo "ERROR: benches/history directory does not exist." >&2
            echo "Create it (with a .gitkeep) and commit it before running benchmarks." >&2
            exit 1
          fi
          if [ ! -w benches/history ]; then
            echo "ERROR: benches/history is not writable by the current user." >&2
            echo "Check repository permissions or runner configuration." >&2
            exit 1
          fi
          # Verify we can actually create a file (directory permission bits alone
          # can lie on some container setups).
          touch benches/history/.write-check && rm benches/history/.write-check || {
            echo "ERROR: benches/history exists but file creation failed." >&2
            exit 1
          }
          echo "benches/history is writable ✓"

      - name: Run scaling benchmarks and generate report
        id: report
        run: |
          set +e
          ./scripts/scaling_benchmark_report.sh
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload scaling report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-scaling-report
          path: |
            benches/target/bench-scaling-report.md
            benches/target/bench-scaling/raw.jsonl
          retention-days: 90
          if-no-files-found: warn

      # Issue #1466: Commit updated benches/history/*.jsonl back to main so
      # the drift-detection history is persisted in the repo and visible via
      # `git log`.  This step runs ONLY on push-to-main, never on PRs, so it
      # cannot accidentally mutate branches under review.
      - name: Commit benchmark history back to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the history JSONL files — nothing else.
          git add benches/history/*.jsonl 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No history files changed — nothing to commit."
          else
            git commit -m "chore(benches): update scaling history [skip ci]

Automated commit from the Benchmark Scaling Report workflow.
Updates benches/history/*.jsonl with the latest complexity-fit
results so gradual drift is visible via git log.

See .github/workflows/benchmarks.yml and benches/src/history.rs."
            git push origin HEAD:main
          fi

      - name: Fail if complexity gate failed
        if: steps.report.outputs.exit_code != '0'
        run: |
          echo "Scaling report gate failed with exit code ${{ steps.report.outputs.exit_code }}."
          echo "See the bench-scaling-report artifact for details."
          exit 1
