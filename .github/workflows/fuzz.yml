name: Fuzzing

on:
  push:
    branches: [main, develop]
    paths:
      - "fuzz/**"
      - "contracts/**"
      - ".github/workflows/fuzz.yml"
  pull_request:
    branches: [main]
    paths:
      - "fuzz/**"
      - "contracts/**"
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    # PR-triggered / push-triggered run: crashes FAIL the build so a newly
    # discovered crash blocks the PR and is immediately visible in CI status.
    # continue-on-error has been removed intentionally (issue #1487).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fuzz_target:
          - fuzz_verification_functions
          - fuzz_bbs_plus_operations
          - fuzz_zk_verifier
          - fuzz_credential_issuance
          - fuzz_batch_operations
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz target (${{ matrix.fuzz_target }}) for 30 seconds
        run: |
          cd fuzz
          cargo +nightly fuzz run ${{ matrix.fuzz_target }} -- -max_total_time=30 -timeout=10

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.fuzz_target }}
          path: fuzz/artifacts/

  fuzz-nightly:
    # Scheduled extended run: non-blocking for merges (the schedule trigger is
    # not part of the required PR checks), but uploads crash artifacts and
    # opens a GitHub issue when a crash is found so failures are not silently
    # buried in the Actions tab (issue #1487).
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      matrix:
        fuzz_target:
          - fuzz_verification_functions
          - fuzz_bbs_plus_operations
          - fuzz_zk_verifier
          - fuzz_credential_issuance
          - fuzz_batch_operations
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run extended fuzzing (${{ matrix.fuzz_target }}) for 5 minutes
        id: fuzz_run
        run: |
          cd fuzz
          cargo +nightly fuzz run ${{ matrix.fuzz_target }} -- -max_total_time=300 -timeout=10
        continue-on-error: true

      - name: Upload crash artifacts
        if: steps.fuzz_run.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.fuzz_target }}
          path: fuzz/artifacts/

      - name: Open GitHub issue on crash
        if: steps.fuzz_run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const target = '${{ matrix.fuzz_target }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[fuzz-nightly] crash detected in ${target}`,
              labels: ['bug', 'security', 'fuzz-crash'],
              body: [
                `## Nightly fuzz crash — \`${target}\``,
                '',
                `The nightly fuzz job found a crash in **${target}** during the run at ${new Date().toISOString()}.`,
                '',
                `**Actions run:** ${runUrl}`,
                '',
                'Crash artifacts have been uploaded to the run above.',
                'Reproduce locally:',
                '```bash',
                'cd fuzz',
                `cargo +nightly fuzz run ${target}`,
                '```',
                '',
                'See [`fuzz/README.md`](fuzz/README.md) for full reproduction and triage instructions.',
              ].join('\n'),
            });

      - name: Fail job if crash was found
        if: steps.fuzz_run.outcome == 'failure'
        run: |
          echo "Crash detected in ${{ matrix.fuzz_target }}. See uploaded artifacts and the GitHub issue opened above."
          exit 1
