name: Docs Link Check

# Catches dead internal cross-references in all Markdown files before they
# land on main. Runs on every PR and every push to main so the check can be
# required in branch protection and so root-level docs are covered too.
# Only relative (intra-repo) links are checked; external URLs are skipped
# to avoid flaky failures from transient network issues.
#
# See docs/troubleshooting-guide.md § "Doc Cross-Reference Drift" for local
# usage instructions.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Check every Markdown file in the repository (including READMEs).
          # --no-progress suppresses the progress bar for clean CI logs.
          # --include-verbatim checks code-block links too.
          # --offline skips all http/https URLs — we only care about
          #   relative internal links here.
          # --exclude-path skips vendored deps and the ADR template, which
          #   intentionally contains placeholder links.
          args: >-
            --offline
            --no-progress
            --include-verbatim
            --exclude-path "(^|/)node_modules/"
            --exclude-path "docs/adr/0000-adr-template.md"
            "**/*.md"
          # Fail the step (and therefore the job) if any dead link is found.
          fail: true
          # Write the link-check report to a file so it can be uploaded as
          # a workflow artifact for inspection.
          output: lychee-report.md

      - name: Upload link-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-link-report
          path: lychee-report.md
          retention-days: 14
