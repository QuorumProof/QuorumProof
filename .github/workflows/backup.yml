# .github/workflows/backup.yml — Issue #912: Periodic contract state backup.
#
# Runs the daily backup documented in docs/backup-system.md: exports
# testnet and mainnet contract state via scripts/automated_backup.sh
# (issue #1649), which encrypts it, uploads it to S3 and verifies the
# result end to end (checksum, decrypt round-trip, restore dry-run, remote
# re-download), then runs scripts/check_backup_integrity.sh and retains a
# copy as a GitHub Actions artifact for 90 days. Can also be triggered manually for an on-demand
# backup ahead of a risky operation (e.g. a contract upgrade).

name: Backup

on:
  schedule:
    # Daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      network:
        description: "Network to back up (leave blank to back up both testnet and mainnet)"
        required: false
        type: choice
        default: "both"
        options:
          - both
          - testnet
          - mainnet

jobs:
  backup:
    name: Backup ${{ matrix.network }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        network: [testnet, mainnet]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Stellar CLI
        run: |
          VERSION=$(curl -sSL https://api.github.com/repos/stellar/stellar-cli/releases/latest | jq -r .tag_name | sed 's/^v//')
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          mkdir -p ~/.local/bin
          mv /tmp/stellar ~/.local/bin/
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Skip network if not selected or secrets missing
        id: gate
        env:
          CONTRACT_QUORUM_PROOF: ${{ matrix.network == 'testnet' && secrets.CONTRACT_QUORUM_PROOF_TESTNET || secrets.CONTRACT_QUORUM_PROOF_MAINNET }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" \
                && "${{ github.event.inputs.network }}" != "both" \
                && "${{ github.event.inputs.network }}" != "${{ matrix.network }}" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$CONTRACT_QUORUM_PROOF" ]]; then
            echo "::warning::Skipping backup for ${{ matrix.network }}: CONTRACT_QUORUM_PROOF_${{ matrix.network == 'testnet' && 'TESTNET' || 'MAINNET' }} secret is not configured."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run backup with verification
        # Issue #1649: automated_backup.sh wraps backup.sh and only succeeds
        # once the artifact has been checksummed, decrypted, content-verified
        # with a restore dry-run, and re-downloaded from S3 with a matching
        # SHA-256. See docs/backup-verification.md.
        if: steps.gate.outputs.run == 'true'
        env:
          STELLAR_NETWORK: ${{ matrix.network }}
          CONTRACT_QUORUM_PROOF: ${{ matrix.network == 'testnet' && secrets.CONTRACT_QUORUM_PROOF_TESTNET || secrets.CONTRACT_QUORUM_PROOF_MAINNET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_NOTIFY_WEBHOOK: ${{ secrets.BACKUP_NOTIFY_WEBHOOK }}
        run: |
          ./scripts/automated_backup.sh \
            --network "$STELLAR_NETWORK" \
            --encrypt \
            --upload "${{ secrets.BACKUP_S3_BUCKET }}"

      - name: Deep integrity check
        if: steps.gate.outputs.run == 'true'
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: ./scripts/check_backup_integrity.sh --deep

      - name: Upload backup artifact
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.network }}-${{ github.run_id }}
          path: |
            backups/daily/
            backups/manifest.json
          retention-days: 90

      - name: Notify on failure
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          echo "::error::Backup failed for network ${{ matrix.network }}. See docs/backup-system.md and docs/disaster-recovery.md for the manual recovery procedure."
