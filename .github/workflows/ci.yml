name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Restore wasm-opt cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/wasm-opt
            target/wasm32-unknown-unknown/release
          key: wasm-${{ hashFiles('contracts/**/Cargo.toml', 'contracts/**/src/**/*.rs') }}

      - name: Build all contracts
        run: |
          cargo build --release --target wasm32-unknown-unknown -p quorum_proof
          cargo build --release --target wasm32-unknown-unknown -p sbt_registry
          cargo build --release --target wasm32-unknown-unknown -p zk_verifier

      - name: Run unit tests
        run: cargo test --target x86_64-unknown-linux-gnu --lib --workspace

      - name: Run integration tests
        run: cargo test --target x86_64-unknown-linux-gnu -p integration_tests

      # ── Migration verification gate ──────────────────────────────────────
      # The migration_verification module runs the snapshot-diff invariant
      # checker against the formal invariant set defined in
      # docs/migration-invariants.md.
      #
      # Positive tests validate that a real migration preserves all invariants.
      # Negative tests validate that the checker correctly detects broken
      # state transitions.
      #
      # This gate MUST pass before any migration PR can merge.
      - name: Run migration verification tests
        run: cargo test --target x86_64-unknown-linux-gnu -p integration_tests -- migration_verification 2>&1

      - name: Run upgrade safety tests
        run: cargo test --target x86_64-unknown-linux-gnu -p integration_tests -- upgrade_safety 2>&1

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run E2E tests (testnet)
        run: |
          cd contracts/e2e_tests
          cargo test --release -- --test-threads=1 --nocapture
        continue-on-error: true

  api-contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-server/package-lock.json
      - run: npm ci
      - run: npm test -- contract-tests.test.ts
      - run: npm test -- snapshots.test.ts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Issue #1003: chaos test scenarios (network delay, packet loss, sustained
  # service unavailability) injected into api-server's mocked RPC client.
  # See docs/resilience.md for the requirements these verify.
  api-server-chaos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-server/package-lock.json
      - run: npm ci
      - run: npm test -- tests/chaos.test.ts

  # Issue #3 follow-up: proves monitoring/prometheus/prometheus.yml's scrape
  # job for api-server's /metrics/events route actually lets alerts.yml's
  # critical-event rules see data, by running a real `prometheus` binary
  # against the real alerts.yml. See api-server/tests/criticalEventPrometheusIntegration.test.ts.
  monitoring-integration:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "2.55.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-server/package-lock.json

      - name: Install prometheus/promtool
        run: |
          curl -sSL -o /tmp/prometheus.tar.gz "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar xzf /tmp/prometheus.tar.gz -C /tmp
          echo "PROMETHEUS_BIN=/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/prometheus" >> "$GITHUB_ENV"
          echo "PROMTOOL_BIN=/tmp/prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" >> "$GITHUB_ENV"

      - name: promtool check config/rules
        run: |
          "$PROMTOOL_BIN" check config monitoring/prometheus/prometheus.yml
          "$PROMTOOL_BIN" check rules monitoring/prometheus/alerts.yml

      - working-directory: api-server
        run: npm ci
      - name: Critical-event metrics + Prometheus scrape/alert tests
        working-directory: api-server
        run: npm test -- criticalEventMetricNames.test.ts criticalEventPrometheusIntegration.test.ts

  # Issue #1485: Run TTSService tests so the service doesn't silently bit-rot.
  # The test file uses vitest with injected sleep/random — no real network calls.
  tts-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/tts/package-lock.json
      - run: npm ci
      - run: npm test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

      - name: TruffleHog scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
