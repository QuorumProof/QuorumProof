# Issue #1632: Longevity testing for long-running processes
#
# Runs the API server under sustained load while sampling memory, handles,
# FDs and event-loop lag, then fails on leaks or resource exhaustion.
#   - Weekly: 2 hour soak
#   - Manual: choose the duration
#   - PRs touching api-server: 3 minute smoke run (catches gross leaks only)
# See docs/longevity-testing.md.
name: Longevity

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: "Run duration (e.g. 30m, 2h, 6h — max 6h on hosted runners)"
        default: "2h"
      concurrency:
        description: "Concurrent virtual clients"
        default: "8"
  pull_request:
    branches: [main, develop]
    paths:
      - "api-server/**"
      - ".github/workflows/longevity.yml"

permissions:
  contents: read

jobs:
  longevity:
    name: API server longevity
    runs-on: ubuntu-latest
    timeout-minutes: 380
    defaults:
      run:
        working-directory: api-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-server/package-lock.json

      - run: npm ci

      - name: Run longevity harness
        env:
          LONGEVITY_DURATION: ${{ github.event_name == 'pull_request' && '3m' || github.event.inputs.duration || '2h' }}
          LONGEVITY_WARMUP: ${{ github.event_name == 'pull_request' && '30s' || '120s' }}
          LONGEVITY_CONCURRENCY: ${{ github.event.inputs.concurrency || '8' }}
          LONGEVITY_REPORT_DIR: ${{ github.workspace }}/longevity-report
        run: |
          set +e
          node --expose-gc --import tsx longevity/harness.ts
          code=$?
          cat "$LONGEVITY_REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          exit $code

      - name: Upload longevity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longevity-report-${{ github.run_id }}
          path: longevity-report/
          retention-days: 30
