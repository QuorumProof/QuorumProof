# .github/workflows/terraform.yml
#
# Infrastructure as Code pipeline — Issue #1652.
#
#   Every PR touching infra/terraform/**:
#     fmt → validate (all roots + modules) → tflint → checkov → terraform test
#     → plan (production, staging) posted as a PR comment
#
#   Weekly (and on demand): drift detection — `plan -detailed-exitcode`
#   against each environment; a non-empty plan opens / updates a GitHub issue.
#
# Applies are never automatic: they run through the protected `infra-apply`
# job below, which requires a manual `workflow_dispatch` and an environment
# approval.

name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC — drift detection
  workflow_dispatch:
    inputs:
      action:
        description: "plan | apply"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_IN_AUTOMATION: "true"
  TF_ROOT: infra/terraform

concurrency:
  group: terraform-${{ github.ref }}-${{ inputs.environment || 'all' }}
  cancel-in-progress: false

jobs:
  # ── Static checks (no cloud credentials) ───────────────────────────────────
  static:
    name: fmt / validate / lint / test
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff "$TF_ROOT"

      - name: terraform validate (modules + environments)
        run: |
          set -euo pipefail
          for dir in "$TF_ROOT"/modules/* "$TF_ROOT"/environments/*; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

      - name: terraform test (mock providers, plan only)
        run: |
          set -euo pipefail
          for dir in "$TF_ROOT"/modules/*; do
            if compgen -G "$dir/tests/*.tftest.hcl" >/dev/null; then
              echo "::group::test $dir"
              terraform -chdir="$dir" test
              echo "::endgroup::"
            fi
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          set -euo pipefail
          tflint --chdir="$TF_ROOT" --config="$PWD/$TF_ROOT/.tflint.hcl" --init
          tflint --chdir="$TF_ROOT" --config="$PWD/$TF_ROOT/.tflint.hcl" --recursive --format compact

  checkov:
    name: checkov (IaC security scan)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          config_file: infra/terraform/.checkov.yml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif
          category: checkov-terraform

  # ── Plan (needs read-only cloud credentials via OIDC) ──────────────────────
  plan:
    name: plan (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: [static]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: terraform-plan
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Write backend + tfvars
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        env:
          BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TFVARS: ${{ matrix.environment == 'production' && secrets.TF_VARS_PRODUCTION || secrets.TF_VARS_STAGING }}
        run: |
          printf '%s\n' "$BACKEND_HCL" > backend.hcl
          printf '%s\n' "$TFVARS" > ci.auto.tfvars

      - name: terraform init
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: terraform init -input=false -backend-config=backend.hcl

      - name: terraform plan
        id: plan
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.TF_ROOT}/environments/${process.env.ENVIRONMENT}/plan.txt`;
            let plan = fs.readFileSync(path, 'utf8');
            if (plan.length > 60000) plan = plan.slice(-60000);
            const marker = `<!-- terraform-plan-${process.env.ENVIRONMENT} -->`;
            const body = `${marker}\n### Terraform plan — \`${process.env.ENVIRONMENT}\`\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # ── Drift detection ────────────────────────────────────────────────────────
  drift:
    name: drift (${{ matrix.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      id-token: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: terraform-plan
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Detect drift
        id: drift
        working-directory: ${{ env.TF_ROOT }}/environments/${{ matrix.environment }}
        env:
          BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TFVARS: ${{ matrix.environment == 'production' && secrets.TF_VARS_PRODUCTION || secrets.TF_VARS_STAGING }}
        run: |
          printf '%s\n' "$BACKEND_HCL" > backend.hcl
          printf '%s\n' "$TFVARS" > ci.auto.tfvars
          terraform init -input=false -backend-config=backend.hcl >/dev/null
          set +e
          terraform plan -input=false -no-color -lock=false -detailed-exitcode > drift.txt
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then cat drift.txt; exit 1; fi

      - name: Open drift issue
        if: steps.drift.outputs.exitcode == '2'
        uses: actions/github-script@v7
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENVIRONMENT;
            const plan = fs.readFileSync(`${process.env.TF_ROOT}/environments/${env}/drift.txt`, 'utf8').slice(-60000);
            const title = `Terraform drift detected: ${env}`;
            const body = `Scheduled drift detection found changes between \`infra/terraform/environments/${env}\` and the live infrastructure.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`\n${plan}\n\`\`\``;
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'infra-drift' });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['infra-drift'] });
            }

  # ── Apply (manual, approval-gated) ─────────────────────────────────────────
  apply:
    name: apply (${{ inputs.environment }})
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    # Protected environment: requires reviewer approval in repo settings.
    environment: infra-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform apply
        working-directory: ${{ env.TF_ROOT }}/environments/${{ inputs.environment }}
        env:
          BACKEND_HCL: ${{ secrets.TF_BACKEND_HCL }}
          TFVARS: ${{ inputs.environment == 'production' && secrets.TF_VARS_PRODUCTION || secrets.TF_VARS_STAGING }}
        run: |
          printf '%s\n' "$BACKEND_HCL" > backend.hcl
          printf '%s\n' "$TFVARS" > ci.auto.tfvars
          terraform init -input=false -backend-config=backend.hcl
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
