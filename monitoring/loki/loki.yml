auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # #586 — 30-day retention policy (default for every stream).
  retention_period: 720h
  # #1653 — per-stream overrides. Loki is the *hot* tier only: anything that
  # must be kept longer (audit / security events, 7 years) is archived to
  # cold storage by scripts/log_archive.sh (or, in AWS, the Firehose →
  # S3 pipeline in infra/terraform/modules/log-archive) before Loki deletes
  # it. See docs/log-retention-policy.md.
  retention_stream:
    # Debug logs are high-volume and low-value after triage.
    - selector: '{job="quorumproof-api", level="debug"}'
      priority: 1
      period: 168h # 7 days
    # Host syslog.
    - selector: '{job="system"}'
      priority: 1
      period: 336h # 14 days
    # Errors and audit/security events stay hot longer for investigations.
    - selector: '{job="quorumproof-api", level=~"error|fatal"}'
      priority: 2
      period: 2160h # 90 days
    - selector: '{job="quorumproof-api", audit="true"}'
      priority: 3
      period: 2160h # 90 days

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem
  compaction_interval: 10m
