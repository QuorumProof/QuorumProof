version: "3.8"

services:
  # #586 — api-server writes structured JSON logs to the shared log volume,
  # which promtail then ships to Loki.
  api-server:
    build:
      context: ../api-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      LOG_FILE: /var/log/quorumproof/api.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional: forward other env vars used by the app
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_QUORUM_PROOF: ${CONTRACT_QUORUM_PROOF:-}
      DRAIN_TIMEOUT_MS: ${DRAIN_TIMEOUT_MS:-30000}
    volumes:
      # Bind-mount the host log directory so promtail can read the log file.
      # The container creates the directory if it does not exist at startup.
      - quorumproof-logs:/var/log/quorumproof
    depends_on:
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  quorumproof-exporter:
    build:
      context: ./exporter
      dockerfile: Dockerfile
    ports:
      - "9101:9101"
    environment:
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_QUORUM_PROOF: ${CONTRACT_QUORUM_PROOF}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-15}
      EXPORTER_PORT: 9101
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ./prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

  # #586 — Log aggregation
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./loki/promtail.yml:/etc/promtail/promtail.yml:ro
      # Mount the shared log volume so promtail can tail api.log
      - quorumproof-logs:/var/log/quorumproof:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
      - api-server
    restart: unless-stopped

volumes:
  # Named volume shared between api-server (writer) and promtail (reader).
  # Using a named volume rather than a host bind-mount avoids permission
  # differences between Docker Desktop (macOS/Windows) and Linux hosts.
  quorumproof-logs:
