version: "3.8"

services:
  # #586 — api-server writes structured JSON logs to the shared log volume,
  # which promtail then ships to Loki.
  api-server:
    build:
      context: ../api-server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      LOG_FILE: /var/log/quorumproof/api.log
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional: forward other env vars used by the app
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_QUORUM_PROOF: ${CONTRACT_QUORUM_PROOF:-}
      DRAIN_TIMEOUT_MS: ${DRAIN_TIMEOUT_MS:-30000}
    volumes:
      # Bind-mount the host log directory so promtail can read the log file.
      # The container creates the directory if it does not exist at startup.
      - quorumproof-logs:/var/log/quorumproof
    depends_on:
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  quorumproof-exporter:
    build:
      context: ./exporter
      dockerfile: Dockerfile
    ports:
      - "9101:9101"
    environment:
      STELLAR_RPC_URL: ${STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
      CONTRACT_QUORUM_PROOF: ${CONTRACT_QUORUM_PROOF}
      SCRAPE_INTERVAL_SECONDS: ${SCRAPE_INTERVAL_SECONDS:-15}
      EXPORTER_PORT: 9101
    depends_on:
      - prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9101/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # Issue #1486 — render alertmanager config before starting Alertmanager.
  # Substitutes ${SLACK_ALERT_WEBHOOK_URL} and ${PAGERDUTY_ROUTING_KEY} from
  # the environment so Alertmanager never posts to a literal ${...} URL.
  # Run `scripts/render_alertmanager_config.sh` (or `docker compose run
  # render-alertmanager-config`) before `docker compose up alertmanager`.
  render-alertmanager-config:
    image: bhgedigital/envsubst:latest
    volumes:
      - ./prometheus/alertmanager.yml:/input/alertmanager.yml:ro
      - ./prometheus:/output
    environment:
      SLACK_ALERT_WEBHOOK_URL: ${SLACK_ALERT_WEBHOOK_URL:?SLACK_ALERT_WEBHOOK_URL must be set — see docs/deployment-guide.md}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:?PAGERDUTY_ROUTING_KEY must be set — see docs/deployment-guide.md}
    command: >
      sh -c "envsubst '$$SLACK_ALERT_WEBHOOK_URL $$PAGERDUTY_ROUTING_KEY'
             < /input/alertmanager.yml
             > /output/alertmanager.rendered.yml
             && echo 'Rendered alertmanager config → /output/alertmanager.rendered.yml'"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      # Mount the rendered (secrets-substituted) config, not the template.
      # Run the render-alertmanager-config service first, or call
      # scripts/render_alertmanager_config.sh directly.
      - ./prometheus/alertmanager.rendered.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      - render-alertmanager-config
    restart: unless-stopped

  # #586 — Log aggregation
  # #1653 — rotates api-server file logs, archives them to cold storage
  # (S3 when LOG_ARCHIVE_BUCKET is set, otherwise the log-archive volume) and
  # enforces the local retention window. See docs/log-retention-policy.md.
  log-archiver:
    image: amazon/aws-cli:2.17.0
    entrypoint: ["/bin/bash", "/opt/quorumproof/log_archive.sh"]
    command: ["--loop", "3600"]
    environment:
      LOG_DIR: /var/log/quorumproof
      LOG_ROTATE_MAX_MB: ${LOG_ROTATE_MAX_MB:-100}
      LOG_LOCAL_RETENTION_DAYS: ${LOG_LOCAL_RETENTION_DAYS:-7}
      LOG_ARCHIVE_BUCKET: ${LOG_ARCHIVE_BUCKET:-}
      LOG_ARCHIVE_PREFIX: ${LOG_ARCHIVE_PREFIX:-logs}
      LOG_ARCHIVE_STORAGE_CLASS: ${LOG_ARCHIVE_STORAGE_CLASS:-GLACIER_IR}
      LOG_ARCHIVE_DIR: /var/lib/quorumproof/log-archive
      LOG_ARCHIVE_RETENTION_DAYS: ${LOG_ARCHIVE_RETENTION_DAYS:-2555}
      HOST_ID: ${HOST_ID:-compose}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ../scripts/log_archive.sh:/opt/quorumproof/log_archive.sh:ro
      - quorumproof-logs:/var/log/quorumproof
      - quorumproof-log-archive:/var/lib/quorumproof/log-archive
    depends_on:
      - api-server
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./loki/promtail.yml:/etc/promtail/promtail.yml:ro
      # Mount the shared log volume so promtail can tail api.log
      - quorumproof-logs:/var/log/quorumproof:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
      - api-server
    restart: unless-stopped

volumes:
  # Named volume shared between api-server (writer) and promtail (reader).
  # Using a named volume rather than a host bind-mount avoids permission
  # differences between Docker Desktop (macOS/Windows) and Linux hosts.
  quorumproof-logs:
  # #1653 — local cold-storage fallback when LOG_ARCHIVE_BUCKET is unset.
  quorumproof-log-archive:
