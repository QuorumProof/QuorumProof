apiVersion: 1

# All JSON files placed in /var/lib/grafana/dashboards (mapped from
# monitoring/grafana/dashboards/ in docker-compose.yml) are provisioned
# automatically into the "QuorumProof" folder.
#
# Current dashboards:
#   api-latency.json          — API request latency percentiles and error rate
#   attestation-health.json   — Attestation success rate and slice activity
#   contract-health.json      — Contract paused status, migration progress, state version
#   credential-volume.json    — Credential issuance and revocation volume
#   critical-events.json      — Critical on-chain event alerting (issue #1484)
#                               Pre-incident trend view; see docs/critical-event-alerting.md
#   backup-and-migration.json — Backup freshness, DR verification, migration progress (issue #1483)
#                               Pre-incident trend view; see docs/backup-system.md,
#                               docs/contract-upgrade-strategy.md, docs/migration-invariants.md

providers:
  - name: QuorumProof
    folder: QuorumProof
    type: file
    options:
      path: /var/lib/grafana/dashboards
