global:
  resolve_timeout: 5m

route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: quorumproof-ops
  routes:
    # Issue #1661 — Cost alerts go to the platform team channel first so
    # engineers can review before escalating. CostBudgetCritical also pages
    # on-call via PagerDuty (matched by the severity:critical route below).
    - match:
        team: platform
      receiver: quorumproof-platform
      group_wait: 60s
      repeat_interval: 4h
      continue: true   # also evaluated by subsequent routes (severity:critical)

    # Critical-severity alerts (DisputeRaised, ContractUpgradeDetected, and
    # other `severity: critical` rules in alerts.yml) page on-call via
    # PagerDuty in addition to Slack. Everything else (warning) is Slack-only
    # — see docs/critical-event-alerting.md for the severity policy behind
    # this split.
    - match:
        severity: critical
      receiver: quorumproof-critical
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: quorumproof-ops
    # Configure your notification channel here.
    # Example: Slack webhook
    slack_configs:
      - api_url: "${SLACK_ALERT_WEBHOOK_URL}"
        channel: "#quorumproof-alerts"
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
        send_resolved: true

  # Issue #1661 — Platform team receiver for cost alerts.
  # Routes to a dedicated #quorumproof-cost channel so billing anomalies
  # are separated from operational noise. CostBudgetCritical also triggers
  # the quorumproof-critical receiver via `continue: true` on the route above.
  - name: quorumproof-platform
    slack_configs:
      - api_url: "${SLACK_ALERT_WEBHOOK_URL}"
        channel: "#quorumproof-cost"
        title: ":moneybag: {{ .GroupLabels.alertname }}"
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Details:* {{ .Annotations.description }}
          *Runbook:* <https://github.com/QuorumProof/QuorumProof/blob/main/docs/cost-alert-thresholds.md|Cost Alert Thresholds>
          {{ end }}
        send_resolved: true

  - name: quorumproof-critical
    slack_configs:
      - api_url: "${SLACK_ALERT_WEBHOOK_URL}"
        channel: "#quorumproof-critical"
        title: ":rotating_light: {{ .GroupLabels.alertname }}"
        text: "{{ range .Alerts }}{{ .Annotations.description }}{{ end }}"
        send_resolved: true
    pagerduty_configs:
      - routing_key: "${PAGERDUTY_ROUTING_KEY}"
        description: "{{ .GroupLabels.alertname }}: {{ range .Alerts }}{{ .Annotations.summary }} {{ end }}"
        severity: critical
        send_resolved: true

# Note: Alertmanager does not expand ${VAR} placeholders natively — either
# template this file at deploy time (envsubst, Helm, etc.) or replace the
# placeholders above with literal secrets injected via your secrets manager.
# This mirrors how the same two channels are wired in-process for real-time
# critical-event alerts in api-server/src/services/alertChannels.ts, which
# reads SLACK_ALERT_WEBHOOK_URL / PAGERDUTY_ROUTING_KEY directly from env.
