[workspace]
members = [
    "contracts/quorum_proof",
    "contracts/sbt_registry",
    "contracts/zk_verifier",
    "contracts/integration_tests",
    "contracts/e2e_tests",
]
exclude = ["benches", "fuzz", "contracts/bbs_plus_v1"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "21.7" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[patch.crates-io]
# Fix h2 security vulnerability RUSTSEC-2026-0258
h2 = "=0.4.16"
# Constrain rand to compatible version with soroban-env-host
rand = "=0.8.5"
rand_chacha = "=0.3.1"
ed25519-dalek = "=2.1.1"
