[workspace]
members = [
    "contracts/quorum_proof",
    "contracts/sbt_registry",
    "contracts/zk_verifier",
    "contracts/integration_tests",
    "contracts/e2e_tests",
]
exclude = ["benches", "fuzz", "contracts/bbs_plus_v1"]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "21.7" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[patch.crates-io]
# Override h2 0.3.27 with secure version to fix RUSTSEC-2026-0258
h2 = { version = "0.4.16" }
# Override mio 1.2.2 with newer version that doesn't have compilation bugs
mio = { version = "1.2.4" }
